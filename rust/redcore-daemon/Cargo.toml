[package]
name = "redcore-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
dbus = "0.9.12"
dbus-tokio = "0.7.6"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

futures-util = "0.3"
